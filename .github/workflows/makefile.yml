name: Build nflog_dns

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Build project"
        required: true
        type: choice
        options:
          - Build project
          - Create a release
        default: Build project
      version:
        description: "Optional release version"
        required: false
        type: string
  push:
    branches:
    - '**'
  schedule:
    - cron: "37 13 * * 3"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.prepare.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'Create a release'
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get -y --no-install-recommends install devscripts libdistro-info-perl

      - name: Prepare release
        id: prepare
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'Create a release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./prepare_release.sh "${{ inputs.version }}"
          VERSION=$(awk -F'"' '/PROGRAM_VERSION/ {print $2}' version.h)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit release
        id: commit
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'Create a release'
        run: |
          git add version.h debian/changelog nflog_dns.spec
          git commit -m "Prepare release ${{ steps.prepare.outputs.version }}"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Do integration testing, requires full VM
  ubuntu-full:
    name: Ubuntu 26.04 QA tests
    needs: [ prepare-release ]
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    permissions:
      security-events: write
      contents: read
      checks: write

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare-release.outputs.sha }}

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: cpp
        queries: security-and-quality

    - name: Install build and test dependencies
      run: |
        sudo rm -f /var/lib/man-db/auto-update
        sudo apt-get update
        sudo apt-get -y --no-install-recommends install gpg libtins-dev libnetfilter-log-dev libspdlog-dev python3 build-essential clang-tidy debhelper-compat lsb-release doctest-dev

    - name: Run clang-tidy
      run: |
        clang-tidy config.cpp nflog_dns.cpp utils.cpp -- -std=c++11 $(pkg-config --cflags libnetfilter_log libtins fmt spdlog)

    - name: Compile binary
      run: make

    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@v4

    - name: Run tests
      run: sudo make test

    - name: Verify installation
      run: sudo make install

    - name: Run the installed binary
      run: nflog_dns --version

    - name: Verify uninstallation
      run: sudo make uninstall

    - name: Verify clean
      run: |
        make clean
        [ -z "$(git status --porcelain)" ] || exit 1

    - name: Compile debug binary
      run: make debug

    - name: Run the debug binary
      run: ASAN_OPTIONS=verify_asan_link_order=0 ./nflog_dns --version

    - name: Verify clean
      run: |
        make clean
        [ -z "$(git status --porcelain)" ] || exit 1

    - name: Verify DEB package build
      run: make deb

    - name: Verify DEB package installation
      run: sudo dpkg -i ../nflog-dns_*.deb

    - name: List installed package contents
      run: dpkg -L nflog-dns

    - name: Run the installed binary
      run: nflog_dns --version

    - name: Verify daemon runs as _nflog-dns user
      run: |
        NFPID="$(systemctl show -p MainPID --value nflog_dns.service)"
        NFLOG_USER="$(ps -o user= -p "${NFPID}")"
        ps -p "${NFPID}" -f
        sudo kill -HUP "${NFPID}"
        [[ "${NFLOG_USER}" == "_nflog-dns" ]] || exit 1

    - name: Stop and disable nflog_dns systemd service
      run: |
        sudo systemctl stop nflog_dns.service
        sudo systemctl disable nflog_dns.service

    - name: Enable and start nflog_dns systemd service
      run: |
        sudo systemctl enable nflog_dns.service
        sudo systemctl start nflog_dns.service

    - name: Verify DEB package reinstallation
      run: sudo dpkg -i ../nflog-dns_*.deb

    - name: Verify DEB package removal
      run: sudo dpkg -r nflog-dns nflog-dns-dbgsym

    - name: Verify _nflog-dns user exists after DEB removal
      run: getent passwd "_nflog-dns"

    - name: Verify DEB package purge
      run: sudo dpkg -P nflog-dns

    - name: Verify _nflog-dns user is removed after DEB purge
      run: getent passwd "_nflog-dns" && false || true

    - name: Verify clean
      run: |
        make clean
        [ -z "$(git status --porcelain)" ] || exit 1

  # Smoke test in chrooted Fedora
  fedora-smoke:
    name: Fedora 44 QA tests
    needs: [ prepare-release ]
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    permissions:
      security-events: write
      contents: read
      checks: write

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare-release.outputs.sha }}

    - name: Install dependencies
      run: |
        sudo rm -f /var/lib/man-db/auto-update
        sudo apt-get update
        sudo apt-get -y --no-install-recommends install dnf systemd-container libnetfilter-log1
        systemd-nspawn --version
        dnf --version
        sudo modprobe nfnetlink nfnetlink_log ip_tables ip6_tables iptable_filter ip6table_filter
        sudo mkdir /tmp/fedora-root

    - name: Install Fedora chroot
      run: |
        sudo dnf \
          --installroot=/tmp/fedora-root \
          --releasever=44 \
          --setopt=cachedir=/tmp/fedora-dnf-cache \
          --setopt=keepcache=True \
          --setopt=install_weak_deps=False \
          --setopt=tsflags=nodocs \
          --repofrompath=fedora,https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os/ \
          --repofrompath=updates,https://dl.fedoraproject.org/pub/fedora/linux/updates/44/Everything/x86_64/ \
          --setopt=fedora.gpgcheck=1 \
          --setopt=updates.gpgcheck=1 \
          --setopt=fedora.gpgkey=https://fedoraproject.org/fedora.pgp \
          --setopt=updates.gpgkey=https://fedoraproject.org/fedora.pgp \
          -y \
          install \
          fedora-release \
          dnf \
          systemd \
          passwd \
          iproute \
          procps-ng \
          findutils \
          coreutils \
          util-linux \
          hostname \
          gcc-c++ \
          make \
          libpcap-devel \
          libtins-devel \
          libnetfilter_log-devel \
          spdlog-devel \
          python3 \
          rpm-build \
          rpmdevtools \
          rpmlint \
          systemd-rpm-macros \
          systemd \
          doctest-devel \
          iptables-nft \
          git

    - name: Setup Fedora 44 chroot
      run: |
        sudo systemd-firstboot \
          --root=/tmp/fedora-root \
          --hostname=fedora44 \
          --locale=C.UTF-8 \
          --timezone=UTC
        sudo systemd-machine-id-setup --root=/tmp/fedora-root
        sudo cp -f /etc/resolv.conf /tmp/fedora-root/etc/resolv.conf

    - name: Copy source to chroot
      run: sudo cp -r ../nflog_dns /tmp/fedora-root/root

    - name: Compile binary
      run: |
        sudo systemd-nspawn \
          --directory=/tmp/fedora-root \
          --machine=fedora44 \
          --quiet \
          -- \
          make -C /root/nflog_dns all

    - name: Run tests
      run: |
        sudo systemd-nspawn \
          --directory=/tmp/fedora-root \
          --machine=fedora44 \
          --capability=CAP_NET_ADMIN \
          --quiet \
          -- \
          make -C /root/nflog_dns test

    - name: Verify installation
      run: |
        sudo systemd-nspawn \
          --directory=/tmp/fedora-root \
          --machine=fedora44 \
          --quiet \
          -- \
          make -C /root/nflog_dns install

    - name: Run the installed binary
      run: |
        sudo systemd-nspawn \
          --directory=/tmp/fedora-root \
          --machine=fedora44 \
          --quiet \
          -- \
          nflog_dns --version

    - name: Verify uninstallation
      run: |
        sudo systemd-nspawn \
          --directory=/tmp/fedora-root \
          --machine=fedora44 \
          --quiet \
          -- \
          make -C /root/nflog_dns uninstall

    - name: Verify clean
      run: |
        sudo systemd-nspawn \
          --directory=/tmp/fedora-root \
          --machine=fedora44 \
          --quiet \
          -- \
          /bin/bash -c 'make -C /root/nflog_dns clean && git -C /root/nflog_dns status --porcelain'

    - name: Verify RPM package build
      run: |
        sudo systemd-nspawn \
          --directory=/tmp/fedora-root \
          --machine=fedora44 \
          --quiet \
          -- \
          make -C /root/nflog_dns rpm

    - name: Verify RPM package installation
      run: |
        sudo systemd-nspawn \
          --directory=/tmp/fedora-root \
          --machine=fedora44 \
          --quiet \
          -- \
          /bin/bash -c 'rpm -i /root/rpmbuild/RPMS/x86_64/*.rpm'

    - name: Run the installed binary
      run: |
        sudo systemd-nspawn \
          --directory=/tmp/fedora-root \
          --machine=fedora44 \
          --quiet \
          -- \
          nflog_dns --version

    - name: Verify _nflog-dns user exists after RPM install
      run: |
        sudo systemd-nspawn \
          --directory=/tmp/fedora-root \
          --machine=fedora44 \
          --quiet \
          -- \
          getent passwd _nflog-dns

    - name: Verify RPM removal
      run: |
        sudo systemd-nspawn \
          --directory=/tmp/fedora-root \
          --machine=fedora44 \
          --quiet \
          -- \
          rpm -e nflog_dns

    - name: Verify clean
      run: |
        sudo systemd-nspawn \
          --directory=/tmp/fedora-root \
          --machine=fedora44 \
          --quiet \
          -- \
          /bin/bash -c 'make -C /root/nflog_dns clean && git -C /root/nflog_dns status --porcelain'

  # Build packages, uses containers
  containers-amd64:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            image: debian:13
            pkgtype: deb
            install: apt-get update && apt-get -y --no-install-recommends install gpg ca-certificates libtins-dev libnetfilter-log-dev libspdlog-dev doctest-dev python3 build-essential debhelper-compat lsb-release adduser
          - name: Debian 12
            image: debian:12
            pkgtype: deb
            install: apt-get update && apt-get -y --no-install-recommends install gpg ca-certificates libtins-dev libnetfilter-log-dev libspdlog-dev doctest-dev python3 build-essential debhelper-compat lsb-release

          - name: Fedora 44
            image: fedora:44
            pkgtype: rpm
            install: dnf install -y gcc-c++ make libpcap-devel libtins-devel libnetfilter_log-devel spdlog-devel doctest-devel python3 rpm-build rpm-sign rpmdevtools rpmlint systemd-rpm-macros systemd
          - name: Fedora 43
            image: fedora:43
            pkgtype: rpm
            install: dnf install -y gcc-c++ make libpcap-devel libtins-devel libnetfilter_log-devel spdlog-devel doctest-devel python3 rpm-build rpm-sign rpmdevtools rpmlint systemd-rpm-macros systemd

          - name: openSUSE Leap 16.0
            image: opensuse/leap:16.0
            pkgtype: rpm
            install: |
              zypper -n ref
              zypper -n addrepo https://download.opensuse.org/repositories/security:netfilter/16.0/security:netfilter.repo
              zypper -n --gpg-auto-import-keys ref
              zypper -n in gcc-c++ make libpcap-devel libtins-devel libnetfilter_log-devel spdlog-devel doctest-devel fmt-devel python3 rpm-build rpmdevtools rpmlint systemd-rpm-macros systemd
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed
            pkgtype: rpm
            install: |
              zypper -n ref
              zypper -n in gcc-c++ make libpcap-devel libtins-devel libnetfilter_log-devel spdlog-devel doctest-devel fmt-devel python3 rpm-build rpmdevtools rpmlint systemd-rpm-macros systemd

          - name: Ubuntu 26.04
            image: ubuntu:26.04
            pkgtype: deb
            install: |
              ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
              echo "Etc/UTC" > /etc/timezone
              apt-get update
              apt-get -y --no-install-recommends install gpg ca-certificates libtins-dev libnetfilter-log-dev libspdlog-dev doctest-dev python3 build-essential debhelper-compat lsb-release
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            pkgtype: deb
            install: |
              ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
              echo "Etc/UTC" > /etc/timezone
              apt-get update
              apt-get -y --no-install-recommends install gpg ca-certificates libtins-dev libnetfilter-log-dev libspdlog-dev doctest-dev python3 build-essential debhelper-compat lsb-release

    name: ${{ matrix.name }} amd64 build
    needs: [ prepare-release ]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 60

    steps:
    - name: Install dependencies
      run: ${{ matrix.install }}

    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare-release.outputs.sha }}

    - name: Inject distribution into package version
      run: |
        case "${{ matrix.pkgtype }}" in
        "deb")
          CODENAME="$(lsb_release -c -s)"
          FULL_VERSION="$(dpkg-parsechangelog --show-field Version)"
          NEW_VERSION="${FULL_VERSION}+${CODENAME}1"
          PACKAGE="$(dpkg-parsechangelog --show-field Source)"
          sed -i "1s/^.*$/${PACKAGE} (${NEW_VERSION}) ${CODENAME}; urgency=medium/" "debian/changelog"
          echo "DEB package version: ${NEW_VERSION}"
          ;;
        "rpm")
          if grep -q "opensuse" "/etc/os-release"
          then
            RELEASE="$(grep '^ID=' "/etc/os-release" | cut -d '=' -f 2 | tr -d '"')"
            RELEASE="${RELEASE##*-}"
            VERSION_ID="$(grep '^VERSION_ID=' "/etc/os-release" | cut -d '=' -f 2 | tr -d '"' | tr -d '.')"
            FULLRELEASE="${RELEASE}${VERSION_ID}"
            sed -i "s/^Release:.*/Release:        1.${FULLRELEASE}/" "nflog_dns.spec"
            NOW="$(date '+%a %b %d %Y')"
            VERSION="$(grep '^Version:' nflog_dns.spec | awk '{print $2}')"
            PACKAGER="GitHub Actions <ci@molukki.com>"
            awk -v rel="${FULLRELEASE}" -v ver="${VERSION}" -v date="${NOW}" \
                -v packager="${PACKAGER}" -v release="${RELEASE}" -v version_id="${VERSION_ID}" '
                /^%changelog/ {
                    print;
                    print "* " date " " packager " - " ver "-" rel;
                    print "- Automated RPM build for openSUSE " release " " version_id "\n";
                    next
                }
                { print }
            ' nflog_dns.spec > nflog_dns.spec.tmp && mv nflog_dns.spec.tmp nflog_dns.spec
            echo "OpenSUSE RPM release: ${FULLRELEASE}"
          else
            echo "No changes"
          fi
          ;;
        *)
          echo "Error: unknown pkgtype" >&2
          exit 1
          ;;
        esac

    - name: Build package
      env:
        RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
        RPM_SIGNING_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
      run: |
        mkdir -p artifacts
        case "${{ matrix.pkgtype }}" in
        "deb")
          make deb
          mv -v ../nflog-dns*_amd64.*deb artifacts/
          ;;
        "rpm")
          make rpm
          printf '%s' "${RPM_SIGNING_KEY}" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '$1=="sec"{print $5; exit}')
          echo "Signing with key: ${KEY_ID}"
          if [ -z "${KEY_ID}" ]
          then
            echo "Error: No signing key found" >&2
            exit 1
          fi

          printf '%s' "${RPM_SIGNING_PASSPHRASE}" > /tmp/gpg-passphrase
          chmod 600 /tmp/gpg-passphrase
          mkdir -p "${HOME}/.gnupg"
          chmod 700 "${HOME}/.gnupg"
          echo "allow-loopback-pinentry" >> "${HOME}/.gnupg/gpg-agent.conf"
          echo "pinentry-mode loopback" >> "${HOME}/.gnupg/gpg.conf"
          gpgconf --kill gpg-agent
          cat <<'EOF' > /tmp/gpg-wrapper
        #!/bin/sh
        exec /usr/bin/gpg --pinentry-mode loopback --passphrase-file /tmp/gpg-passphrase "$@"
        EOF
          chmod +x /tmp/gpg-wrapper
          cat <<EOF > "${HOME}/.rpmmacros"
        %_gpg_name ${KEY_ID}
        %__gpg /tmp/gpg-wrapper
        EOF

          rpmsign --addsign "${HOME}"/rpmbuild/RPMS/x86_64/*.rpm
          gpg --export --armor "${KEY_ID}" > /tmp/pubkey.asc
          rpm --import /tmp/pubkey.asc
          rpm -Kv "${HOME}"/rpmbuild/RPMS/x86_64/*.rpm
          cp -v "${HOME}"/rpmbuild/RPMS/x86_64/*.rpm artifacts/
          ;;
        *)
          echo "Error: unknown pkgtype" >&2
          exit 1
          ;;
        esac

    - name: Verify DEB package installation
      if: ${{ matrix.pkgtype == 'deb' }}
      run: dpkg -i artifacts/*.*deb

    - name: Run the installed binary
      if: ${{ matrix.pkgtype == 'deb' }}
      run: nflog_dns --version

    - name: Verify DEB package re-installation
      if: ${{ matrix.pkgtype == 'deb' }}
      run: dpkg -i artifacts/*.*deb

    - name: Verify DEB package removal
      if: ${{ matrix.pkgtype == 'deb' }}
      run: dpkg -r nflog-dns nflog-dns-dbgsym

    - name: Verify RPM package installation
      if: ${{ matrix.pkgtype == 'rpm' }}
      run: rpm -i artifacts/*.rpm

    - name: Run the installed binary
      if: ${{ matrix.pkgtype == 'rpm' }}
      run: nflog_dns --version

    - name: Verify RPM package removal
      if: ${{ matrix.pkgtype == 'rpm' }}
      run: rpm -e nflog_dns

    - name: Upload DEB package
      if: ${{ matrix.pkgtype == 'deb' }}
      uses: actions/upload-artifact@v7
      with:
        name: nflog-dns ${{ matrix.name }} amd64 deb
        path: artifacts/*_amd64.*deb

    - name: Upload RPM package
      if: ${{ matrix.pkgtype == 'rpm' }}
      uses: actions/upload-artifact@v7
      with:
        name: nflog_dns ${{ matrix.name }} x86_64 rpm
        path: artifacts/*.rpm

  # Build Devuan packages, uses chroot
  chroot-amd64:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Devuan 6.0
            release: excalibur
          - name: Devuan 5.0
            release: daedalus

    name: ${{ matrix.name }} amd64 build
    needs: [ prepare-release ]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Install Devuan keyring
        run: |
          echo "Note: Devuan keyring information page is at https://www.devuan.org/os/keyring"
          wget -O /tmp/devuan-keyring.deb http://deb.devuan.org/merged/pool/DEVUAN/main/d/devuan-keyring/devuan-keyring_2025.08.09_all.deb
          sudo dpkg -i /tmp/devuan-keyring.deb

      - name: Add Devuan Ceres package source
        run: |
          echo "deb http://deb.devuan.org/merged/ ceres main contrib non-free" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update

      - name: Install debootstrap from Devuan Ceres
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -y install debootstrap/ceres

      - name: Debootstrap ${{ matrix.name }}
        run: sudo debootstrap --variant=minbase ${{ matrix.release }} ../devuan-${{ matrix.release }} http://deb.devuan.org/merged

      - name: Install build dependencies
        run: |
          sudo chroot ../devuan-${{ matrix.release }} apt-get update
          sudo chroot ../devuan-${{ matrix.release }} apt-get -y --no-install-recommends install gpg ca-certificates libtins-dev libnetfilter-log-dev libspdlog-dev doctest-dev python3 build-essential debhelper-compat lsb-release adduser

      - name: Inject distribution into package version
        run: |
          FULL_VERSION="$(dpkg-parsechangelog --show-field Version)"
          NEW_VERSION="${FULL_VERSION}+${{ matrix.release }}1"
          PACKAGE="$(dpkg-parsechangelog --show-field Source)"
          sed -i "1s/^.*$/${PACKAGE} (${NEW_VERSION}) ${{ matrix.release }}; urgency=medium/" "debian/changelog"
          echo "DEB package version: ${NEW_VERSION}"

      - name: Bind mount checkout to chroot
        run: |
          mkdir -p ../devuan-${{ matrix.release }}/tmp/nflog_dns-build/nflog_dns
          sudo mount -o bind . ../devuan-${{ matrix.release }}/tmp/nflog_dns-build/nflog_dns

      - name: Build package
        run: |
          echo 'cd /tmp/nflog_dns-build/nflog_dns && make deb' | sudo chroot ../devuan-${{ matrix.release }} /bin/sh
          mkdir -p artifacts
          cp -v ../devuan-${{ matrix.release }}/tmp/nflog_dns-build/*.deb artifacts/

      - name: Verify DEB package installation
        run: echo 'dpkg -i /tmp/nflog_dns-build/*.deb' | sudo chroot ../devuan-${{ matrix.release }} /bin/sh

      - name: Run the installed binary
        run: sudo chroot ../devuan-${{ matrix.release }} nflog_dns --version

      - name: Verify disabling and enabling nflog_dns sysvinit service
        run: |
          sudo chroot ../devuan-${{ matrix.release }} update-rc.d nflog_dns remove
          sudo chroot ../devuan-${{ matrix.release }} update-rc.d nflog_dns defaults

      - name: Verify DEB package removal
        run: sudo chroot ../devuan-${{ matrix.release }} dpkg -r nflog-dns nflog-dns-dbgsym

      - name: Upload DEB package
        uses: actions/upload-artifact@v7
        with:
          name: nflog-dns ${{ matrix.name }} amd64 deb
          path: |
            artifacts/*_amd64.*deb

  containers-arm64:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            image: debian:13
          - name: Debian 12
            image: debian:12
          - name: Ubuntu 26.04
            image: ubuntu:26.04
          - name: Ubuntu 24.04
            image: ubuntu:24.04

    name: ${{ matrix.name }} arm64 build
    needs: [ prepare-release ]
    runs-on: [ self-hosted, ARM64 ]
    container:
      image: ${{ matrix.image }}
      volumes:
        - /var/cache/apt/archives:/var/cache/apt/archives:rw
        - /var/lib/apt/lists:/var/lib/apt/lists:rw
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Install build dependencies
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          apt-get update
          apt-get -y --no-install-recommends install gpg ca-certificates libtins-dev libnetfilter-log-dev libspdlog-dev doctest-dev python3 build-essential debhelper-compat lsb-release adduser

      - name: Inject distribution into package version
        run: |
          CODENAME="$(lsb_release -c -s)"
          FULL_VERSION="$(dpkg-parsechangelog --show-field Version)"
          NEW_VERSION="${FULL_VERSION}+${CODENAME}1"
          PACKAGE="$(dpkg-parsechangelog --show-field Source)"
          sed -i "1s/^.*$/${PACKAGE} (${NEW_VERSION}) ${CODENAME}; urgency=medium/" "debian/changelog"
          echo "DEB package version: ${NEW_VERSION}"

      - name: Build package
        run: |
          mkdir -p artifacts
          make deb
          mv -v ../nflog-dns*$(lsb_release -c -s)*_arm64.*deb artifacts/

      - name: Verify DEB package installation
        run: dpkg -i artifacts/*.deb

      - name: Run the installed binary
        run: nflog_dns --version

      - name: Verify DEB package removal
        run: dpkg -r nflog-dns nflog-dns-dbgsym

      - name: Upload DEB package
        uses: actions/upload-artifact@v7
        with:
          name: nflog-dns ${{ matrix.name }} arm64 deb
          path: artifacts/*_arm64.*deb

  create-release:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'Create a release'
    name: Create GitHub Release
    needs: [ prepare-release, ubuntu-full, fedora-smoke, containers-amd64, chroot-amd64, containers-arm64 ]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Remove debug packages from release
        run: rm -f release-artifacts/**/*dbgsym*

      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          find . -type f \( -name "*.deb" -o -name "*.rpm" \) -exec sha256sum {} \; | sed 's|  .*/nflog|  nflog|g' | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release note
        run: |
          cat > release-body.md << 'EOF'
          Prebuilt installation packages available for:
          - AMD64 / x86_64:
            - Debian 12, 13
            - Ubuntu 24.04, 26.04
            - Devuan 5.0, 6.0
            - Fedora 43, 44
            - openSUSE Leap 16.0, Tumbleweed
          - ARM64:
            - Debian 12, 13
            - Ubuntu 24.04, 26.04
          
          To verify the download:
              sha256sum -c SHA256SUMS.txt
          
          To install on Debian/Ubuntu/Devuan:
              sudo dpkg -i nflog-dns_*.deb
          
          To install on Fedora/openSUSE:
              sudo rpm -i nflog_dns-*.rpm
          
          
          SHA256 Checksums:
          
          EOF
          cat release-artifacts/SHA256SUMS.txt \
            | sed 's/^/    /g' >> release-body.md

      - name: Tag release
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare-release.outputs.version }}
          files: release-artifacts/**/*
          generate_release_notes: true
          body_path: release-body.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generate-apt-repository:
    name: Generate APT repository
    # needs: create-release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Download DEB packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apt-repository/pool/main
          mapfile -t releases < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .id'
          )
          for release_id in "${releases[@]}"
          do
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              --jq '.[] | select(.name | endswith(".deb")) | [.name, .url] | @tsv' |
            while IFS=$'\t' read -r name url
            do
              deb="$RUNNER_TEMP/$name"
              gh api -H "Accept: application/octet-stream" "$url" >"$deb"
              package="${name%%_*}"
              first_letter="${package:0:1}"
              mkdir -p "apt-repository/pool/main/$first_letter/$package"
              mv "$deb" "apt-repository/pool/main/$first_letter/$package/"
            done
          done

      - name: Generate APT metadata
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          repo="$GITHUB_WORKSPACE/apt-repository"
          pool="$repo/pool"
          work="$RUNNER_TEMP/apt"
          mkdir -p "$work"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          signing_key=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ -z "$signing_key" ]
          then
            echo "Error: No signing key found"
            exit 1
          fi
          declare -A distributions=()
          declare -A distro_arches=()
          declare -A distro_files=()
          declare -A architectures=()
          for deb in "$pool"/main/*/*/*.deb
          do
            name=$(basename "$deb")
            base="${name%.deb}"
            arch="${base##*_}"
            version="${base%_*}"
            distro_release="${version##*+}"
            distro="${distro_release%%[0-9]*}"
            if [[ "$version" != *"+"* || -z "$distro" || -z "$arch" ]]
            then
              echo "Cannot derive distribution/architecture from: $name"
              exit 1
            fi
            relative="${deb#"$repo"/}"
            distributions["$distro"]=1
            architectures["$arch"]=1
            distro_arches["$distro/$arch"]=1
            distro_files["$distro/$arch"]+="$relative"$'\n'
          done
          if [ "${#distributions[@]}" -eq 0 ]
          then
            echo "No Debian packages found"
            exit 1
          fi
          for arch in "${!architectures[@]}"
          do
            (
              cd "$repo"
              dpkg-scanpackages \
                --arch "$arch" \
                --multiversion \
                pool \
                /dev/null
            ) > "$work/Packages.$arch"
          done
          for distro in "${!distributions[@]}"
          do
            distro_arch_list=()
            for key in "${!distro_arches[@]}"
            do
              if [[ "$key" == "$distro/"* ]]
              then
                distro_arch_list+=("${key#*/}")
              fi
            done
            mapfile -t distro_arch_list < <(
              printf '%s\n' "${distro_arch_list[@]}" | sort -u
            )
            for arch in "${distro_arch_list[@]}"
            do
              output="$repo/dists/$distro/main/binary-$arch"
              wanted="$work/wanted-$distro-$arch"
              mkdir -p "$output"
              printf '%s' "${distro_files["$distro/$arch"]}" |
                sed '/^$/d' |
                sort -u > "$wanted"
              awk -v wanted="$wanted" '
                BEGIN {
                  while ((getline line < wanted) > 0)
                    wanted_file[line] = 1
                  close(wanted)
                  RS = ""
                  ORS = "\n\n"
                }
                {
                  filename = ""
                  n = split($0, lines, "\n")
                  for (i = 1; i <= n; i++) {
                    if (lines[i] ~ /^Filename: /) {
                      filename = substr(lines[i], 11)
                      break
                    }
                  }
                  if (filename in wanted_file)
                    print
                }
              ' "$work/Packages.$arch" > "$output/Packages"
              gzip -9 -c "$output/Packages" > "$output/Packages.gz"
            done
            architectures_string=$(
              printf '%s\n' "${distro_arch_list[@]}" |
                sort -u |
                paste -sd' ' -
            )
            release_dir="$repo/dists/$distro"
            apt-ftparchive \
              -o "APT::FTPArchive::Release::Origin=nflog-dns" \
              -o "APT::FTPArchive::Release::Label=nflog-dns" \
              -o "APT::FTPArchive::Release::Suite=$distro" \
              -o "APT::FTPArchive::Release::Codename=$distro" \
              -o "APT::FTPArchive::Release::Components=main" \
              -o "APT::FTPArchive::Release::Architectures=$architectures_string" \
              release "$release_dir" > "$release_dir/Release"
            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase "$APT_SIGNING_PASSPHRASE" \
              --local-user "$signing_key" \
              --clearsign \
              --output "$release_dir/InRelease" \
              "$release_dir/Release"
            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase "$APT_SIGNING_PASSPHRASE" \
              --local-user "$signing_key" \
              --detach-sign \
              --armor \
              --output "$release_dir/Release.gpg" \
              "$release_dir/Release"
          done

      - name: Publish APT public key
        run: |
          gpg --batch --armor --export \
            "$(
              gpg --batch --with-colons --list-secret-keys |
              awk -F: '$1 == "fpr" { print $10; exit }'
            )" \
            > apt-repository/nflog-dns-archive-keyring.asc

          gpg --batch --export \
            "$(
              gpg --batch --with-colons --list-secret-keys |
              awk -F: '$1 == "fpr" { print $10; exit }'
            )" \
            > apt-repository/nflog-dns-archive-keyring.pgp

      - name: Upload DEB repository
        uses: actions/upload-artifact@v4
        with:
          name: apt-repository
          path: apt-repository

  generate-rpm-repository:
    name: Generate RPM repository
    # needs: create-release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Install RPM tools
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends createrepo-c rpm

      - name: Download RPM packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rpm-downloads"
          mapfile -t releases < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .id'
          )
          for release_id in "${releases[@]}"
          do
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              --jq '.[] | select(.name | endswith(".rpm")) | [.name, .url] | @tsv' |
            while IFS=$'\t' read -r name url
            do
              gh api -H "Accept: application/octet-stream" "$url" >"$RUNNER_TEMP/rpm-downloads/$name"
            done
          done
          if ! compgen -G "$RUNNER_TEMP/rpm-downloads/*.rpm" > /dev/null
          then
            echo "No RPM packages found"
            exit 1
          fi

      - name: Generate RPM metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          output="$GITHUB_WORKSPACE/rpm-repository/rpm"
          declare -A repositories=()
          for rpm_file in "$RUNNER_TEMP/rpm-downloads"/*.rpm
          do
            name=$(basename "$rpm_file")
            arch="${name%.rpm}"
            arch="${arch##*.}"
            if [ -z "$arch" ]
            then
              echo "Cannot determine architecture from: $name"
              exit 1
            fi
            release=$(rpm -qp --qf '%{RELEASE}' "$rpm_file")
            distro="${release#*.}"
            if [ -z "$distro" ] || [ "$distro" = "$release" ]
            then
                echo "Cannot determine distribution from: $(basename "$rpm_file")"
                exit 1
            fi
            if [ -z "$distro" ] || [ "$distro" = "(none)" ]
            then
              echo "Cannot determine distribution from: $name"
              exit 1
            fi
            repository="$output/$distro/$arch"
            mkdir -p "$repository"
            cp "$rpm_file" "$repository/"
            repositories["$distro/$arch"]=1
          done
          for repository in "${!repositories[@]}"
          do
            createrepo_c "$output/$repository"
            cat > "$output/$repository/nflog-dns.repo" <<EOF
          [nflog-dns]
          name=nflog-dns
          baseurl=https://pyksy.github.io/nflog_dns/rpm/$repository/
          enabled=1
          gpgcheck=0
          EOF
          done

      - name: Upload RPM repository
        uses: actions/upload-artifact@v4
        with:
          name: rpm-repository
          path: rpm-repository

  generate-repository-pages:
    name: Generate repository pages
    runs-on: ubuntu-latest

    needs: [ generate-apt-repository, generate-rpm-repository ]

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Download APT repository
        uses: actions/download-artifact@v8
        with:
          name: apt-repository
          path: apt-repository

      - name: Download RPM repository
        uses: actions/download-artifact@v8
        with:
          name: rpm-repository
          path: rpm-repository

      - name: Assemble repository pages
        run: |
          mkdir -p pages
          mv apt-repository/* rpm-repository/* pages

      - name: Upload repository pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Verify DEB repository
        run: |
          source "/etc/os-release"
          curl -sSfL --retry 10 --retry-delay 3 \
            https://pyksy.github.io/nflog_dns/nflog-dns-archive-keyring.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/nflog-dns-archive-keyring.gpg -
          echo "deb [signed-by=/usr/share/keyrings/nflog-dns-archive-keyring.gpg] https://pyksy.github.io/nflog_dns ${VERSION_CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/nflog-dns.list
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install nflog-dns

      - name: Verify RPM repository
        run: |
          docker run --rm fedora:44 bash -c '
            set -euo pipefail
            curl -sSfL --retry 10 --retry-delay 3 \
              -o /etc/yum.repos.d/nflog-dns.repo \
              https://pyksy.github.io/nflog_dns/rpm/fc44/x86_64/nflog-dns.repo
            dnf install -y nflog_dns
          '
